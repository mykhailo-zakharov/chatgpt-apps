<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatGPT Apps</title>
  <meta name="description" content="A collection of small apps built with ChatGPT.">
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #111827;
      background: #f9fafb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    main { width: min(900px, calc(100% - 40px)); margin: 0 auto; padding: 64px 0; }
    h1 { margin: 0 0 8px; font-size: 2rem; }
    p { color: #6b7280; margin: 0 0 32px; }
    .apps { display: grid; gap: 16px; }
    .app {
      display: block;
      padding: 20px;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      background: white;
      color: inherit;
      text-decoration: none;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .app:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.08); }
    .app h2 { margin: 0 0 6px; font-size: 1.1rem; }
    .app span { color: #6b7280; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <h1>ChatGPT Apps</h1>
    <p>A home for apps built with ChatGPT. Each app lives in its own folder.</p>

    <section class="apps" aria-label="Apps">
      <a class="app" href="./hello-from-chatgpt/">
        <h2>Hello from ChatGPT</h2>
        <span>A first tiny app in the collection.</span>
      </a>
    </section>
  </main>
</body>
</html>
